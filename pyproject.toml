[project]
name = "polars-hist-db"
version = "0.12.84"
description = "(dsv,jetstream) --> dataframe <--> bitemporal-tables"
authors = [{ name = "jr200", email = "jayshan+git@gmail.com" }]
readme = "README.md"
requires-python = ">=3.15.2,<4.0"

dependencies = [
    "nats-py>=2.16.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pymysql>=1.2.3",
    "pytz>=2026.6",
    "pyyaml>=6.0.3",
    "scandir-rs>=2.10.1",
    "sql-metadata>=3.0.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.optional-dependencies]
sqlalchemy = ["polars"]
nats = ["nats-py"]
xtdb = ["adbc-driver-flightsql>=1.13.0", "psycopg[binary]>=3.3.6"]
crdt = [
    "pycrdt>=0.14.10",
]

[project.urls]
Repository = "https://github.com/jr200-labs/polars-hist-db"

[project.scripts]
polars-hist-db-parity = "polars_hist_db.parity:main"

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "quarto-cli",
    "ruff>=0.17.3,<0.18",
    "types-python-dateutil>=2.9.0.20261029",
    "types-pytz>=2026.6.0.20261031",
    "types-pyyaml>=6.0.12.20261030",
    "pyarrow-stubs>=20.0.0.20260819",
    "pycrdt>=0.14.10",
    "hypothesis>=6.170.14",
    "psycopg[binary]>=3.3.6",
]

[tool.setuptools.package-data]
"polars_hist_db" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not integration'"
log_cli = "true"
log_cli_level = "WARN"
markers = [
    "integration: needs external infra (MySQL / NATS); excluded from default collection. Run via `pytest -m integration` in a workflow that brings the infra up.",
]
# log_cli_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
testpaths = [
    "tests"
]

[tool.uv.sources]
quarto-cli = { git = "https://github.com/quarto-dev/quarto-cli", rev = "623cd99e8c66ec29c9ef1fe17e4469c11c3c14eb" }

[tool.mypy]
warn_unused_configs = true
packages = ["polars_hist_db"]

[[tool.mypy.overrides]]
module = [
    "sql_metadata.*",
    "scandir_rs.*",
    "nats.*",
    "nkeys.*",
    "adbc_driver_flightsql.*",
    "psycopg.*",
    "pyarrow.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.ruff]
extend = ".shared/ruff.toml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
